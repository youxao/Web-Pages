<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI智能伴侣</title>
<style>
  :root {
    --red: #FF4B4B;
    --text: #262730;
    --muted: #808495;
    --border: #e6e9ef;
    --sidebar-bg: #f0f2f6;
    --bubble-bg: #f0f2f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Source Sans Pro", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .logo { font-size: 28px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .main { flex: 1; display: flex; min-height: 0; }

  /* ---------- 侧边栏（仿 Streamlit） ---------- */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 22px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .sidebar h3 {
    font-size: 15px;
    font-weight: 600;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(49, 51, 63, .1);
  }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 1px rgba(255, 75, 75, .25);
  }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .st-btn {
    width: 100%;
    padding: 8px 12px;
    background: #fff;
    color: var(--text);
    border: 1px solid rgba(49, 51, 63, .2);
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .st-btn:hover { border-color: var(--red); color: var(--red); }

  /* ---------- 聊天区 ---------- */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 24px 12px; }
  .messages-inner { max-width: 760px; margin: 0 auto; }
  .empty { text-align: center; padding-top: 16vh; }
  .empty .empty-icon { font-size: 56px; margin-bottom: 14px; }
  .empty p { font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .empty .muted { font-size: 13px; color: var(--muted); }

  .msg { display: flex; gap: 10px; margin: 16px 0; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    user-select: none;
    background: #fff;
    border: 1px solid var(--border);
  }
  .msg.assistant .avatar { background: #ffeaea; border-color: #ffd7d7; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg.assistant .bubble { background: var(--bubble-bg); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--text); color: #fff; border-top-right-radius: 4px; }
  .msg.error .bubble { background: #fdecec; color: #b00020; border: 1px solid #f5c6c6; }
  .bubble a { color: var(--red); }
  .msg.user .bubble a { color: #ffb3b3; }
  .inline-code {
    background: rgba(49, 51, 63, .08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 13px;
  }
  .msg.user .inline-code { background: rgba(255, 255, 255, .2); }
  .code-block {
    background: #f6f8fa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 13px;
    margin: 6px 0;
    white-space: pre;
  }
  .msg.user .code-block { background: #33363f; border-color: #33363f; color: #e8e8e8; }

  /* 打字指示器 */
  .bubble.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  /* ---------- 输入区（仿 st.chat_input） ---------- */
  .input-wrap {
    flex-shrink: 0;
    padding: 14px 24px 18px;
    background: #fff;
    border-top: 1px solid var(--border);
  }
  .input-box {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bubble-bg);
    border-radius: 22px;
    padding: 8px 8px 8px 16px;
    border: 1px solid transparent;
    transition: border-color .15s;
  }
  .input-box:focus-within { border-color: var(--red); }
  #input {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    max-height: 160px;
    padding: 8px 0;
  }
  #input::placeholder { color: var(--muted); }
  .send-btn {
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s;
  }
  .send-btn:hover { opacity: .88; }
  .send-btn:disabled { opacity: .45; cursor: not-allowed; }

  footer {
    flex-shrink: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 8px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--red); }

  @media (max-width: 768px) {
    body { overflow: auto; }
    .main { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    #messages { padding: 16px 12px; }
    .bubble { max-width: 85%; }
    .input-wrap { padding: 10px 12px 14px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">🤖</span>
  <h1>AI智能伴侣</h1>
</header>

<div class="main">
  <!-- 侧边栏：伴侣信息 -->
  <aside class="sidebar">
    <h3>伴侣信息</h3>
    <div class="field">
      <label for="nickname">昵称</label>
      <input type="text" id="nickname" placeholder="请输入昵称" autocomplete="off" />
    </div>
    <div class="field">
      <label for="nature">性格</label>
      <input type="text" id="nature" placeholder="请输入性格" autocomplete="off" />
    </div>
    <div class="field">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
      <div class="hint">只保存在当前浏览器（localStorage），不会上传到任何服务器，请放心。</div>
    </div>
    <button class="st-btn" id="clearBtn">🗑️ 清空聊天记录</button>
  </aside>

  <!-- 聊天区 -->
  <section class="chat">
    <div id="messages">
      <div class="messages-inner">
        <div class="empty" id="emptyState">
          <div class="empty-icon">🤖</div>
          <p>你好呀，我是你的 AI 智能伴侣</p>
          <p class="muted">在左侧设置昵称与性格，然后在下方输入消息开始聊天</p>
        </div>
      </div>
    </div>
    <div class="input-wrap">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="按 Enter 发送，Shift + Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
      </div>
    </div>
  </section>
</div>

<footer>
  AI智能伴侣 · Powered by <a href="https://platform.deepseek.com" target="_blank" rel="noopener">DeepSeek</a> ·
  <a href="https://bilibili.com" target="_blank" rel="noopener">Get Help</a> ·
  <a href="https://tanghong.xin" target="_blank" rel="noopener">Report a Bug</a>
</footer>

<script>
(function () {
  'use strict';

  var API_URL = 'https://api.deepseek.com/chat/completions'; // DeepSeek 兼容 OpenAI 接口，浏览器可跨域直连
  var MODEL = 'deepseek-v4-flash';
  var STORE_KEY = 'companion_chat_v1';
  var MAX_SEND = 20; // 每次发送给 API 的最大历史消息条数（防止上下文超长）

  function $(id) { return document.getElementById(id); }
  var messagesEl = $('messages');
  var innerEl = messagesEl.querySelector('.messages-inner');
  var emptyEl = $('emptyState');
  var inputEl = $('input');
  var sendBtn = $('sendBtn');
  var clearBtn = $('clearBtn');
  var nickEl = $('nickname');
  var natureEl = $('nature');
  var keyEl = $('apiKey');

  var history = [];   // 聊天记录（localStorage 持久化）
  var streaming = false;

  /* ========== 工具函数 ========== */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      history = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(history)) history = [];
    } catch (e) { history = []; }
    nickEl.value = localStorage.getItem('companion_nickname') || '';
    natureEl.value = localStorage.getItem('companion_nature') || '';
    keyEl.value = localStorage.getItem('companion_api_key') || '';
  }

  function saveHistory() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 轻量 Markdown 渲染：代码块 / 行内代码 / 加粗 / 斜体 / 链接 / 换行 */
  function renderMarkdown(text) {
    var blocks = [];
    var html = escapeHtml(text);
    html = html.replace(/```([\s\S]*?)```/g, function (m, code) {
      blocks.push('<pre class="code-block"><code>' + code.trim() + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    html = html.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/\n/g, '<br>');
    html = html.replace(/\u0000(\d+)\u0000/g, function (m, i) { return blocks[+i]; });
    return html;
  }

  /* ========== 渲染 ========== */
  function renderAll() {
    innerEl.innerHTML = '';
    if (!history.length) {
      innerEl.appendChild(emptyEl);
      return;
    }
    history.forEach(function (m) { appendMessageDom(m.role, m.content); });
    scrollBottom();
  }

  function appendMessageDom(role, content) {
    if (emptyEl.parentNode === innerEl) emptyEl.remove();
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : role === 'error' ? 'error' : 'assistant');
    var avatar = role === 'user' ? '🙂' : role === 'error' ? '⚠️' : '🤖';
    var body = role === 'user'
      ? escapeHtml(content).replace(/\n/g, '<br>')
      : renderMarkdown(content);
    wrap.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble">' + body + '</div>';
    innerEl.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  function showTyping() {
    var wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.innerHTML = '<div class="avatar">🤖</div><div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    innerEl.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  /* ========== API 调用 ========== */
  function buildSystemPrompt() {
    var nick = nickEl.value.trim() || '小助手';
    var nat = natureEl.value.trim() || '傲娇';
    return '你是一个傲娇的AI助手,昵称为' + nick + ',性格为' + nat + '。\n请根据用户输入的内容进行回答，回答时要体现出你的傲娇性格。\n回复内容不能过长,要像微信聊天一样';
  }

  /* 流式读取 SSE 响应，每收到一段内容就回调 onDelta */
  async function streamChat(messages, onDelta) {
    var resp = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + keyEl.value.trim()
      },
      body: JSON.stringify({ model: MODEL, messages: messages, stream: true })
    });
    if (!resp.ok) {
      var msg = '请求失败（HTTP ' + resp.status + '）';
      try {
        var err = await resp.json();
        if (err && err.error && err.error.message) msg = err.error.message;
      } catch (e) {}
      if (resp.status === 401) msg = 'API Key 无效或已过期，请检查左侧的 Key';
      if (resp.status === 429) msg = '请求过于频繁，触发了限流，请稍后再试';
      throw new Error(msg);
    }
    if (!resp.body) throw new Error('当前浏览器不支持流式响应');

    var reader = resp.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buffer += decoder.decode(r.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var t = lines[i].trim();
        if (t.indexOf('data:') !== 0) continue;
        var data = t.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        try {
          var json = JSON.parse(data);
          var delta = json.choices && json.choices[0] && json.choices[0].delta;
          if (delta && delta.content) onDelta(delta.content);
        } catch (e) { /* 忽略不完整的行 */ }
      }
    }
  }

  /* ========== 发送流程 ========== */
  async function send() {
    var text = inputEl.value.trim();
    if (!text || streaming) return;
    var key = keyEl.value.trim();
    if (!key) {
      appendMessageDom('error', '请先在左侧输入你的 DeepSeek API Key ～');
      return;
    }

    // 用户消息入列并渲染
    history.push({ role: 'user', content: text });
    saveHistory();
    appendMessageDom('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    setBusy(true);
    console.log('-----> 用户发送请求，提示词：', text);

    var typingWrap = showTyping();
    var fullResponse = '';
    var assistantWrap = null;
    var bubbleEl = null;

    try {
      var sys = buildSystemPrompt();
      var msgs = [{ role: 'system', content: sys }].concat(history.slice(-MAX_SEND));
      await streamChat(msgs, function (delta) {
        fullResponse += delta;
        if (!assistantWrap) {
          typingWrap.remove();
          assistantWrap = appendMessageDom('assistant', '');
          bubbleEl = assistantWrap.querySelector('.bubble');
        }
        bubbleEl.innerHTML = renderMarkdown(fullResponse); // 流式逐字更新
        scrollBottom();
      });

      if (!assistantWrap) { // 接口未返回任何内容
        typingWrap.remove();
        fullResponse = '（没有收到回复）';
        assistantWrap = appendMessageDom('assistant', fullResponse);
      }
      history.push({ role: 'assistant', content: fullResponse });
      saveHistory();
    } catch (err) {
      typingWrap.remove();
      appendMessageDom('error', err.message || '出错了，请稍后重试');
      console.error(err);
    } finally {
      setBusy(false);
    }
  }

  function setBusy(busy) {
    streaming = busy;
    sendBtn.disabled = busy;
    inputEl.disabled = busy;
  }

  /* ========== 事件绑定 ========== */
  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'; // 自动增高
  });

  clearBtn.addEventListener('click', function () {
    if (streaming) return;
    if (history.length && !confirm('确定清空所有聊天记录吗？')) return;
    history = [];
    saveHistory();
    renderAll();
  });

  nickEl.addEventListener('change', function () {
    localStorage.setItem('companion_nickname', nickEl.value.trim());
  });
  natureEl.addEventListener('change', function () {
    localStorage.setItem('companion_nature', natureEl.value.trim());
  });
  keyEl.addEventListener('input', function () {
    localStorage.setItem('companion_api_key', keyEl.value.trim());
  });

  /* ========== 初始化 ========== */
  load();
  renderAll();
})();
</script>
</body>
</html>
