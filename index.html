<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI智能伴侣</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <span class="logo">🤖</span>
  <h1>AI智能伴侣</h1>
</header>

<div class="main">
  <!-- 侧边栏：伴侣信息 -->
  <aside class="sidebar">
    <h3>伴侣信息</h3>
    <div class="field">
      <label for="nickname">昵称</label>
      <input type="text" id="nickname" placeholder="请输入昵称" autocomplete="off" />
    </div>
    <div class="field">
      <label for="nature">性格</label>
      <input type="text" id="nature" placeholder="请输入性格" autocomplete="off" />
    </div>
    <div class="field">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
      <div class="hint">只保存在当前浏览器（localStorage），不会上传到任何服务器，请放心。</div>
    </div>
    <button class="st-btn" id="clearBtn">🗑️ 清空聊天记录</button>
  </aside>

  <!-- 聊天区 -->
  <section class="chat">
    <div id="messages">
      <div class="messages-inner">
        <div class="empty" id="emptyState">
          <div class="empty-icon">🤖</div>
          <p>你好呀，我是你的 AI 智能伴侣</p>
          <p class="muted">在左侧设置昵称与性格，然后在下方输入消息开始聊天</p>
        </div>
      </div>
    </div>
    <div class="input-wrap">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="按 Enter 发送，Shift + Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
      </div>
    </div>
  </section>
</div>

<!-- Bug 反馈弹窗 -->
<div class="modal-overlay" id="bugModal" hidden>
  <div class="modal">
    <h3>🐞 反馈问题</h3>
    <p class="modal-hint">请描述你遇到的问题，点击发送后会用你电脑上的默认邮件客户端发到我的邮箱。</p>
    <textarea id="bugText" rows="5" placeholder="描述一下发生了什么…"></textarea>
    <div class="modal-actions">
      <button class="st-btn" id="bugCancel">取消</button>
      <button class="st-btn modal-send" id="bugSend">📧 发送邮件</button>
    </div>
  </div>
</div>

<footer>
  AI智能伴侣 · Powered by <a href="https://platform.deepseek.com" target="_blank" rel="noopener">DeepSeek</a> ·
  <a href="https://bilibili.com" target="_blank" rel="noopener">Get Help</a> ·
  <a href="#" id="bugBtn" title="通过邮件反馈问题">Report a Bug</a>
</footer>

<script src="js/app.js"></script>
</body>
</html>
